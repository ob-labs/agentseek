version = 1
template = "deepagents/mcp"
name = "{{ cookiecutter.project_name }}"
env_file = ".env"

[tools]
required = ["uv", "node", "npm"]

[paths]
required = ["pyproject.toml", ".mcp.json", "frontend/package.json", "frontend/node_modules"]

[env.AGENTSEEK_MODEL_PROVIDER]
required = true
default = "{{ cookiecutter.default_model_provider }}"
description = "LangChain model provider used by the DeepAgents graph."

[env.AGENTSEEK_MODEL]
required = true
default = "{{ cookiecutter.default_model }}"
description = "Model id used by the DeepAgents graph."
aliases = ["DEEPAGENTS_MODEL", "BUB_MODEL"]

[env.OPENAI_API_KEY]
required = true
description = "Credential for the selected model provider."
aliases = ["ANTHROPIC_API_KEY", "GOOGLE_API_KEY"]

[env.LANGGRAPH_HOST]
required = false
default = "127.0.0.1"
description = "Bind address for the LangGraph development server."

[env.FRONTEND_HOST]
required = false
default = "127.0.0.1"
description = "Bind address for the Vite development server."

[services.langgraph]
url = "http://127.0.0.1:{{ cookiecutter.langgraph_port }}"

[services.frontend]
url = "http://127.0.0.1:{{ cookiecutter.frontend_port }}"

[processes.langgraph]
command = ["sh", "-lc", "uv run langgraph dev --port {{ cookiecutter.langgraph_port }} --no-browser --host \"${LANGGRAPH_HOST:-127.0.0.1}\""]

[processes.frontend]
command = ["npm", "run", "dev"]
cwd = "frontend"

[checks.langgraph]
type = "http"
target = "http://127.0.0.1:{{ cookiecutter.langgraph_port }}"
timeout = 2
attempts = 3

[checks.frontend]
type = "http"
target = "http://127.0.0.1:{{ cookiecutter.frontend_port }}"
timeout = 2
attempts = 3

[tasks.sync]
description = "Install Python dependencies with uv."
command = ["uv", "sync"]

[tasks.frontend]
description = "Install frontend dependencies."
command = ["npm", "install", "--prefix", "frontend"]

[tasks.mcp-smoke]
description = "Verify MCP discovery, schema conversion, and calculator invocation without a model key."
command = ["uv", "run", "python", "-m", "{{ cookiecutter.project_slug }}.mcp_smoke"]
