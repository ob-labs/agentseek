version = 1
template = "langchain/agentic-rag"
name = "{{ cookiecutter.project_name }}"
env_file = ".env"

[tools]
required = ["uv", "node", "npm"]

[paths]
required = [
  "pyproject.toml",
  "langgraph.json",
  "docker-compose.yml",
  "frontend/package.json",
  "frontend/node_modules",
]

[env.AGENTSEEK_MODEL_PROVIDER]
required = true
default = "{{ cookiecutter.default_model_provider }}"
description = "LangChain model provider: openai, anthropic, or google_genai."

[env.AGENTSEEK_MODEL]
required = true
default = "{{ cookiecutter.default_model }}"
description = "Model id passed to LangChain chat model initialization."
aliases = ["BUB_MODEL"]

[env.SEEKDB_MODE]
required = true
default = "embedded"
description = "seekdb mode: embedded (default) or server (explicit Docker/remote mode)."

[env.SEEKDB_PATH]
required = true
default = "{{ cookiecutter.seekdb_path }}"
description = "Data directory for embedded seekdb; keep it outside the generated project."

[env.SEEKDB_HOST]
required = false
default = "127.0.0.1"
description = "Optional server-mode seekdb host."

[env.SEEKDB_PORT]
required = false
default = "2881"
description = "Optional server-mode seekdb MySQL-compatible port."

[env.SEEKDB_USER]
required = true
default = "root"
description = "seekdb user."

[env.SEEKDB_DB_NAME]
required = true
default = "{{ cookiecutter.seekdb_db_name }}"
description = "seekdb database name."

[env.VECTOR_TABLE_NAME]
required = true
default = "{{ cookiecutter.vector_table_name }}"
description = "Vector table used for ingested documents."

[env.LANGGRAPH_HOST]
required = false
default = "127.0.0.1"
description = "LangGraph dev bind host. Use 0.0.0.0 only on trusted networks."

[env.FRONTEND_HOST]
required = false
default = "127.0.0.1"
description = "Vite frontend bind host. Use 0.0.0.0 only on trusted networks."

[services.backend]
url = "http://127.0.0.1:2024"

[services.frontend]
url = "http://127.0.0.1:{{ cookiecutter.frontend_port }}"

[processes.backend]
command = ["sh", "-lc", "uv run langgraph dev --no-browser --host ${LANGGRAPH_HOST:-127.0.0.1}"]

[processes.frontend]
command = ["npm", "run", "dev"]
cwd = "frontend"

[checks.backend]
type = "http"
target = "http://127.0.0.1:2024"
timeout = 2
attempts = 3

[checks.frontend]
type = "http"
target = "http://127.0.0.1:{{ cookiecutter.frontend_port }}"
timeout = 2
attempts = 3

[tasks.sync]
description = "Install Python dependencies."
command = ["uv", "sync"]

[tasks.frontend]
description = "Install frontend dependencies."
command = ["npm", "install", "--prefix", "frontend"]

[tasks.embedded-smoke]
description = "Run the embedded seekdb smoke test."
command = ["uv", "run", "--extra", "dev", "python", "-m", "pytest"]

[tasks.seekdb-docker]
description = "Start the optional seekdb Docker server (set SEEKDB_MODE=server)."
command = ["docker", "compose", "up", "-d", "seekdb"]

[tasks.seekdb-docker-stop]
description = "Stop the optional seekdb Docker server."
command = ["docker", "compose", "down"]

[tasks.seekdb-skills]
description = "Install recommended OceanBase seekdb agent skills."
command = ["npx", "skills", "add", "oceanbase/seekdb-ecology-plugins", "--all"]
